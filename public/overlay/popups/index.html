<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Popups Overlay</title>

  <!-- Inter, for the Velora claim card. Loaded explicitly rather
       than left to a system-ui fallback: OBS, Safari and iPad each
       resolve that to a different face, so the card would look
       different on stream than it does on the iPad. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&display=swap"
  />

  <link rel="stylesheet" href="./styles.css?v=11" />

  <!-- Socket.IO client -->
  <script type="module" src="https://cdn.socket.io/4.7.2/socket.io.esm.min.js"></script>

  <!-- ⭐ Load shared popup state (Safari-safe absolute path) -->
  <script type="module" src="/overlay/shared/_sharedPopups.js"></script>
</head>

<body>
  <div id="overlay-root">
    <div id="reward-popup"></div>
    <div id="alert-container"></div>
  </div>

  <!-- ⭐ Load main popup script (Safari-safe absolute path) -->
  <script type="module" src="/overlay/popups/main.js?v=10"></script>
</body>
</html>
