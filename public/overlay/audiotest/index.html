<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GivesAChat — audio test</title>

  <!--
    A DELIBERATELY MINIMAL PAGE.

    It exists to answer one question: does GoLightStream carry
    audio from a browser source of ours at all?

    The chat overlay's audio plays correctly in a browser but not
    in GoLightStream, while the popups overlay's audio plays in
    both. That points at the layer rather than the code — but the
    two overlays differ in a hundred ways (a <video> logo, a
    WebSocket, scaling, fonts), so neither is a clean test.

    This page has none of that. No sockets, no video element, no
    imports, no keys. It plays one sound every 8 seconds and
    draws a counter so you can see it is alive on the canvas.

      audible in GoLightStream  -> the platform is fine, and the
                                   chat overlay has something
                                   specific stopping it
      silent in GoLightStream   -> that layer carries no audio,
                                   and it is a Lightstream
                                   setting, not our code

    Delete once the question is settled.
  -->

  <style>
    html, body {
      margin: 0;
      background: #101010;
      color: #f0b90b;
      font-family: system-ui, sans-serif;
      overflow: hidden;
    }

    #panel {
      position: fixed;
      top: 24px;
      left: 24px;
      font-size: 28px;
      line-height: 1.5;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
    }

    #count { font-size: 64px; font-weight: 600; }
    .muted { color: #9a9a9a; font-size: 20px; }
  </style>
</head>

<body>
  <div id="panel">
    <div>GivesAChat audio test</div>
    <div id="count">0</div>
    <div id="status" class="muted">starting…</div>
  </div>

  <script>
    /* A real Velora reward sound — same CDN, same .ogg format the
       chat overlay uses, so the format is being tested too. */
    const SOUND =
      "https://assets.velora.tv/sounds/2b644c8b-7e43-44ec-b4c3-69951d540b25.ogg";

    const countEl = document.getElementById("count");
    const statusEl = document.getElementById("status");

    let plays = 0;

    function beep() {
      plays++;
      countEl.textContent = plays;

      /* Identical to what the popups overlay does, and to what
         the chat overlay does in compositor mode. */
      const audio = new Audio(SOUND);
      audio.volume = 1.0;

      audio
        .play()
        .then(() => {
          statusEl.textContent = `play() resolved — ${new Date()
            .toTimeString()
            .slice(0, 8)}`;
        })
        .catch((err) => {
          statusEl.textContent = `play() REFUSED: ${err && err.name}`;
        });
    }

    /* First one shortly after load, then every 8 seconds. */
    setTimeout(beep, 1500);
    setInterval(beep, 8000);
  </script>
</body>
</html>
