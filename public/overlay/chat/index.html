<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GivesAChat Overlay</title>

  <!-- ⭐ Global chat + layout styles -->
  <link rel="stylesheet" href="/overlay/chat/styles.css?v=31" />

  <!-- ⭐ Official header styles

       EACH STYLESHEET CARRIES ITS OWN VERSION. Bumping
       styles.css does nothing for a change made in here — that
       mistake was made once already, when the header outline
       landed in header.css and only styles.css was bumped, so
       the change would have been served from cache.

       v4: compositor date fixes — webfont, left anchor, shadow
       outline. -->
  <link rel="stylesheet" href="/overlay/chat/styles/header.css?v=5" />

  <!-- ⭐ Arimo — for the compositor build's date only.

       GoLightStream's renderer turned out to have none of
       Helvetica, Arial, Liberation Sans or Nimbus Sans, so naming
       them in a font stack fell through to its own wide default
       and the date drifted left across the logo. A font you SHIP
       cannot fall through.

       Arimo is metric compatible with Arial, which is metric
       compatible with the Helvetica macOS resolves `sans-serif`
       to — so the date measures the same as it does in OBS.

       Loaded for every viewer but USED only by the
       html.opacity-none rule in header.css, so OBS and the iPad
       still draw the date in the system font exactly as before.
       A plain stylesheet link cannot throw, and display=swap
       means a blocked or slow response degrades to the current
       behaviour rather than blocking the render. -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Arimo:wght@400&display=swap" />

  <!-- ⭐ Velora reward card + message effects + galaxy + glow + rainbow -->
  <link rel="stylesheet" href="/overlay/chat/styles/velora/velora.css?v=4" />

  <!-- ⭐ Velora badge styles -->
  <link rel="stylesheet" href="/overlay/chat/badges/velora/badges.css?v=3" />

  <!-- ⭐ YouTube-specific styles -->
  <link rel="stylesheet" href="/overlay/chat/styles/youtube/youtube.css?v=2" />

  <!-- ⭐ Blaze badge styles -->
  <link rel="stylesheet" href="/overlay/chat/styles/blaze/blaze.css?v=3" />

  <!-- ⭐ Beam emote / sticker / GIF sizing -->
  <link rel="stylesheet" href="/overlay/chat/styles/beam/beam.css?v=4" />
</head>

<body>

  <!-- ⭐ Scaled overlay canvas -->
  <div id="overlay-scale-wrapper">
    <div id="overlay-root">
      <div id="reward-popup"></div>
    </div>
  </div>

  <!-- ⭐ FIXED chat (NOT scaled) -->
  <div id="chat-fixed-wrapper">

    <!-- ⭐ HEADER (OBS ONLY) -->
    <div id="chat-header" class="obs-only">

      <!-- ⭐ Header Logo -->
      <video id="header-logo" autoplay muted loop playsinline>
        <source src="/icons/gam-logo.webm" type="video/webm">
      </video>

      <!-- ⭐ Viewer Box -->
      <div id="viewer-box" class="obs-only">
        <img id="beam-logo" src="/icons/beam.png" alt="Beam Logo" />
        <span id="viewer-label">GIVERS Watching Now:</span>
        <span id="viewer-count">0</span>
      </div>

      <!-- ⭐ DATE -->
      <div id="current-date">
        <span id="date-output"></span>
      </div>

    </div>

    <!-- ⭐ Chat container -->
    <div id="chat-container">
      <div id="messages"></div>
    </div>
  </div>

  <!-- ⭐ Velora Stream Alerts iframe -->
  <iframe
    id="velora-alerts-frame"
    src=""
    style="
      position:absolute;
      width:1px;
      height:1px;
      opacity:0;
      pointer-events:none;
    "
  ></iframe>

  <!-- ⭐ Overlay logic (CORRECT FILE NAME) -->
  <script type="module" src="/overlay/chat/main.js?v=30"></script>

</body>
</html>
